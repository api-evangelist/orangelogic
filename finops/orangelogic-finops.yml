meters:
- name: platform_license
  description: Annual OrangeDAM platform license, the primary committed cost. Scoped per organization.
  unit: contract
  aggregation: sum
  dimensions:
  - organization
  - term
- name: storage
  description: Managed asset storage consumed by the DAM, where metered by the deployment.
  unit: bytes
  aggregation: sum
  dimensions:
  - organization
- name: content_delivery
  description: CDN / egress for public links and presigned content delivery, where applicable.
  unit: bytes
  aggregation: sum
  dimensions:
  - organization
- name: users
  description: Licensed user seats, a common enterprise pricing dimension.
  unit: seats
  aggregation: max
  dimensions:
  - organization
principles:
- name: Visibility
  description: Track the annual license alongside instance storage and content-delivery/egress; the API adds no separate metered line.
- name: Allocation
  description: Attribute the OrangeDAM license and storage to the business units and archives that use the DAM.
- name: Optimization
  description: Right-size storage tiers, prune stale assets, and manage CDN/egress on content delivery; align module and seat counts to actual use at renewal.
- name: Accountability
  description: Assign a DAM owner to review the annual agreement, seat counts, and storage against budget before each renewal.
