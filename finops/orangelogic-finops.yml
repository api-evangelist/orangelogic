description: >-
  FinOps view of Orange Logic (OrangeDAM) spend. Orange Logic is an enterprise
  platform licensed under a custom, contact-sales agreement rather than a metered
  pay-per-call API. The dominant cost is the annual platform license, typically
  scoped by users, storage, asset volume, modules (AI, transcription, integrations),
  and support/SLA level. The REST API is a capability of the licensed instance and
  carries no separate published per-call charge. Because the deployment is
  per-instance, associated infrastructure (storage, CDN/egress for content delivery)
  can also factor into total cost of ownership.
notes: >-
  Per-organization rates are not public and are not reconciled here; obtain a quote
  from Orange Logic sales. An AWS Marketplace private-offer path exists, which can
  route spend through an existing AWS billing relationship.
