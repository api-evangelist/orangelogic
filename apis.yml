aid: orangelogic
url: https://raw.githubusercontent.com/api-evangelist/orangelogic/refs/heads/main/apis.yml
name: Orange Logic
kind: company
description: Orange Logic builds OrangeDAM (formerly branded Cortex), an enterprise
  digital asset management (DAM) and media asset management (MAM) platform used by
  museums, media companies, financial institutions, healthcare, and government
  archives. OrangeDAM exposes a documented REST API for assets, metadata, search,
  users, folders, and webhooks. The API is per-instance and customer-gated - every
  call is made against your own organization's Orange Logic instance host rather
  than a single shared public gateway, so the base URL is written here as the
  placeholder https://{OrangeLogicURL}/webapi. Endpoints come in two families - the
  newer /webapi/ endpoints (each ending in a unique identifier and version, e.g.
  token_48I_v1) and the legacy /api/ endpoints (with a version number in the path);
  Orange Logic recommends the /webapi/ family. Responses are JSON or XML. Pricing is
  enterprise contact-sales only.
image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
tags:
- Digital Asset Management
- DAM
- Media Asset Management
- MAM
- Enterprise
- Metadata
- Archive
created: '2026-07-05'
modified: '2026-07-05'
specificationVersion: '0.19'
apis:
- aid: orangelogic:orangelogic-authentication-api
  name: Orange Logic Authentication API
  tags:
  - Authentication
  - OAuth
  - Security
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://developer.orangelogic.com/reference/authentication-endpoints
  baseURL: https://{OrangeLogicURL}/webapi
  properties:
  - url: https://developer.orangelogic.com/reference/authentication
    type: Documentation
  - url: https://developer.orangelogic.com/reference/authentication-endpoints
    type: APIReference
  - url: https://developer.orangelogic.com/reference/oauth-2-token
    type: APIReference
  description: Authenticate against an Orange Logic instance and obtain tokens for
    subsequent calls. Supports OAuth 2.0 (client ID and secret), non-expiring bearer
    tokens, and basic username/password login. The OAuth token endpoint returns an
    access token valid for 24 hours and a refresh token valid for 30 days. Confirmed
    endpoint paths include POST /webapi/security/oauth2/token_48I_v1 and
    /webapi/security/clientcredentialsauthentication/authenticate_46H_v1.
- aid: orangelogic:orangelogic-search-api
  name: Orange Logic Search API
  tags:
  - Search
  - Discovery
  - Assets
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://developer.orangelogic.com/reference/search-api
  baseURL: https://{OrangeLogicURL}/API
  properties:
  - url: https://developer.orangelogic.com/reference/search-api
    type: APIReference
  - url: https://developer.orangelogic.com/reference/about
    type: Documentation
  description: Find assets across the DAM with query criteria, field selection,
    pagination, sorting, and AI-powered semantic search. The confirmed endpoint is
    GET or POST /API/search/v4.0/search, accepting query, fields, format (JSON or
    XML), countperpage, pagenumber, sort, and semanticquery parameters.
- aid: orangelogic:orangelogic-assets-media-api
  name: Orange Logic Assets and Media API
  tags:
  - Assets
  - Media
  - Upload
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://developer.orangelogic.com/reference/about
  baseURL: https://{OrangeLogicURL}/webapi
  properties:
  - url: https://developer.orangelogic.com/reference/about
    type: Documentation
  - url: https://www.orangelogic.com/rest-api-in-digital-asset-management
    type: Documentation
  description: Upload, import, retrieve, and manage digital assets and their
    representations - single-file uploads, batch uploads, cloud-storage imports, and
    large-file (>1.5GB) handling, plus content delivery via public links, CDN, and
    presigned URLs. Upload endpoints are versioned (UploadNewMedia v1.0-v3.0 legacy;
    the newer /webapi upload family is recommended). Exact per-instance endpoint
    paths are modeled from the public reference; the precise identifiers vary by
    instance and version.
- aid: orangelogic:orangelogic-datatable-api
  name: Orange Logic DataTable API
  tags:
  - DataTable
  - CRUD
  - Objects
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://developer.orangelogic.com/reference/datatable-apis
  baseURL: https://{OrangeLogicURL}/API
  properties:
  - url: https://developer.orangelogic.com/reference/datatable-apis
    type: APIReference
  - url: https://developer.orangelogic.com/reference/datatable-assets
    type: Documentation
  description: Work directly with database objects - assets (images, video, audio),
    folders, groups, users, tags, keywords, and relationships - through generic
    CREATE, READ, UPDATE, and DELETE calls. Paths follow the pattern
    /API/DataTable/V2.2/Documents.{asset-type}.{asset-subtype}:Read and similar
    verbs. Object-type and subtype segments vary per instance.
- aid: orangelogic:orangelogic-metadata-api
  name: Orange Logic Metadata API
  tags:
  - Metadata
  - Fields
  - Tags
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://developer.orangelogic.com/reference/about
  baseURL: https://{OrangeLogicURL}/webapi
  properties:
  - url: https://developer.orangelogic.com/reference/about
    type: Documentation
  description: List and modify asset metadata - retrieve all metadata fields, update
    tags and linked fields, and manage language-specific field values. Includes
    batch edit and batch upsert operations. Endpoint identifiers are per-instance
    and are modeled here from the public documentation rather than reproduced verbatim.
- aid: orangelogic:orangelogic-users-contacts-api
  name: Orange Logic Users and Contacts API
  tags:
  - Users
  - Contacts
  - Permissions
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://developer.orangelogic.com/reference/datatable-apis
  baseURL: https://{OrangeLogicURL}/API
  properties:
  - url: https://developer.orangelogic.com/reference/datatable-apis
    type: Documentation
  description: Manage user and contact accounts, group assignments, permissions, and
    organizational hierarchies. Handled through the DataTable object model (Users,
    Groups, Contacts). Exact endpoint identifiers vary by instance and are modeled
    from the public reference.
- aid: orangelogic:orangelogic-webhooks-api
  name: Orange Logic Webhooks API
  tags:
  - Webhooks
  - Events
  - Integration
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://developer.orangelogic.com/reference/about
  baseURL: https://{OrangeLogicURL}/webapi
  properties:
  - url: https://developer.orangelogic.com/reference/about
    type: Documentation
  description: Subscribe to asset lifecycle events and send webhooks to a third-party
    service when assets are created, edited, or deleted. This is a server-to-endpoint
    HTTP callback surface, not a persistent socket connection. Webhook management
    endpoint identifiers are per-instance and modeled from the public documentation.
