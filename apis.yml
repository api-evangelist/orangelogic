aid: orangelogic

url: https://raw.githubusercontent.com/api-evangelist/orangelogic/refs/heads/main/apis.yml

name: Orange Logic

kind: company

description: Orange Logic builds OrangeDAM (formerly branded Cortex), an enterprise
  digital asset management (DAM) and media asset management (MAM) platform used by
  museums, media companies, financial institutions, healthcare, and government
  archives. OrangeDAM exposes a documented REST API for assets, metadata, search,
  users, folders, and webhooks. The API is per-instance and customer-gated - every
  call is made against your own organization's Orange Logic instance host rather
  than a single shared public gateway, so the base URL is written here as the
  placeholder https://{OrangeLogicURL}/webapi. Endpoints come in two families - the
  newer /webapi/ endpoints (each ending in a unique identifier and version, e.g.
  token_48I_v1) and the legacy /api/ endpoints (with a version number in the path);
  Orange Logic recommends the /webapi/ family. Responses are JSON or XML. Pricing is
  enterprise contact-sales only.

