paths:
  /clientcredentialsauthentication/authenticate_46H_v1:
    post:
      summary: Authenticate
      description: Authenticate a user by providing client credentials
      operationId: authenticate
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - client_id
              - client_secret
              properties:
                client_id:
                  type: string
                  description: The client ID of an Orange Logic user or application account.
                client_secret:
                  type: string
                  description: The client secret of an Orange Logic user or application account.
            examples:
              Request Example:
                value:
                  client_id: RVdaT0RSblYyRnJtWS5TMFJpT2ZiaDBGdWdjblExQ1BvT1YxaGwzQXlOa3pYcU03QUIyR2ZhTnJQUnFRWG1RQWU3cGhwNjJEeXVANkBIcTZMNG40dlEqKg
                  client_secret: OEdPSTVMb3RuSjNteHBLVFN5QVFXTVVldkFacmR5UlBiNklHM2RMaVFPa1R5UVhvWFcuNTUxZ29rU25LcEZ6WQ
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n  \"access_token\": \"hExf7tX@w1tUOkvDrgRaSuDvp9IXMiwhM8kEhBitw5NWtrYLxYIcj2eg76gdpOgzafz17hsqGLaz2if.I7QvXKXI96foyAs@dTEa2eVydmR8Q.Zf5tVkRes9mLGDkFtl2\",\n  \"token_type\": \"Bearer\",\n  \"expires_in\": 7200\n}"
              schema:
                type: object
                properties:
                  access_token:
                    type: string
                    example: hExf7tX@w1tUOkvDrgRaSuDvp9IXMiwhM8kEhBitw5NWtrYLxYIcj2eg76gdpOgzafz17hsqGLaz2if.I7QvXKXI96foyAs@dTEa2eVydmR8Q.Zf5tVkRes9mLGDkFtl2
                  token_type:
                    type: string
                    example: Bearer
                  expires_in:
                    type: integer
                    example: 7200
                    default: 0
      deprecated: false
      tags:
