        in: header
        description: An authentication token. If empty, the token included in the current cookie is used.
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - Login
              - Password
              - format
              properties:
                Login:
                  type: string
                  description: The user’s email or Login ID
                Password:
                  type: string
                  description: The user’s password
                format:
                  type: string
                  description: The response format (XML or JSON)
                  default: XML
                IncludeUserEmail:
                  type: boolean
                  description: Whether the response includes the user’s email
                  default: false
                dateformat:
                  type: string
                  description: The output <a href="https://developer.orangelogic.com/reference/date-and-time">date format</a>
                  default: yyyy-MM-ddTHH:mm:ss
      responses:
        '200':
