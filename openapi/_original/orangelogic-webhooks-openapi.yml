info:
  title: webhooks
  version: '1.0'
servers:
- url: https://{orangelogicURL}/webapi/extensibility/webhook/subscription/
  variables:
    orangelogicURL:
      default: orangelogicURL
security:
- sec0: []
x-readme-fauxas: true
paths:
  /create_22E_v1:
    post:
      summary: Create a webhook subscription
      description: Create a new webhook subscription
      operationId: create-a-webhook-subscription
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                subscription:
                  type: object
                  description: The subscription object defines the webhook, including the webhook’s name and ID, where the webhook URL information is sent, and the criteria that triggers the webhook.
                  properties:
                    id:
                      type: string
                      description: The webhook’s identifier. This can include letters, numbers, characters, and spaces. You can use this identifier to reference this subscription in our webhook endpoints with the parameter <code>subscriptionID</code>.
                    name:
                      type: string
                      description: The webhook’s name. This can include letters, numbers, characters, and spaces.
                    description:
                      type: string
                      description: The webhook’s description. This can include letters, numbers, characters, and spaces.
                    isActive:
                      type: boolean
                      description: When <code>true</code>, the subscription is active. When <code>false</code>, the subscription is not active.
                      default: true
                    definition:
                      type: object
                      description: The subscription's definition, which is made up of a URL and headers.
                      properties:
                        targetURL:
                          type: string
                          description: The URL of the endpoint the webhook goes to. <br><br/> ℹ️ <span style="color:#46B8DA"><strong>NOTE</strong></span><br>Only HTTPS endpoints are allowed.
                        customHeaders:
                          type: object
                          description: 'The custom header to include in the <span style="color:#0171C2">**POST**</span> request to the webhook endpoints. You can use this to add extra context to webhook notifications with the format <code>”description”: “string”</code>.</p>'
                          properties:
                            jobInformation:
                              type: string
                              description: The job information. This information is not required; this is just an example of metadata you might want to add to the asset.
                            '[customInformation]':
                              type: string
                              description: 'You can add other information to the headers with this syntax <code>"customInformation": "string"</code>.'
                    inclusivePredicates:
                      type: object
                      description: Use this parameter to allow webhooks to be sent under certain conditions. This requires custom configuration from Orange Logic. If you do not need to limit the asset information sent via the webhook, you can delete these parameters. If you need to add limitations, submit a support request.
                      properties:
                        name:
                          type: string
                          description: The inclusive predicate’s name.
                        description:
                          type: string
                          description: The inclusive predicate’s description.
                        conditions:
                          type: array
                          description: Use this parameter to allow webhooks to be sent under certain conditions. This requires custom configuration from Orange Logic. To add limitations, submit a support request and include the ID 2P7YOHB2RFVU.
                          items:
                            properties:
                              criteria:
                                type: string
                                description: 'The event type that triggers a webhook:  <ul> <li><strong><a href="https://developer.orangelogic.com/reference/webhooks#body" target="_blank">Topic</a></strong>: Filters by the event type, such as when an asset is created, deleted, or modified, in the format <code>domain.eventname</code>. For example, the topic when an asset is created is: <code>Documents.Created</code>. </li> <li><strong>Data</strong>: Filters directly on the data itself.</li> <li><strong>Tenant</strong>: Filters by the site short location code.</li> <li><strong>UserId</strong>: Filters by the originating user who triggered the event.</li> </ul>'
                                enum:
                                - Topic
                                - Data
                                - Tenant
                                - UserID
                              pattern:
                                type: string
                                description: 'The pattern of the event type that triggers a webhook, in wildcard format:  <ul> <li><code>?</code> means none or one character (any character).</li> <li><code>&ast;</code> means none or any number of any characters.</li> </ul> For example, say you want Orange Logic to send webhooks for any event that deletes a document’s metadata. You’d enter <code>&ast;.Delete</code>.'
                            type: object
                    exclusivePredicates:
                      type: object
                      description: Use this parameter to prevent webhooks from being sent under certain conditions. This requires custom configuration from Orange Logic. If you do not need to limit the asset information sent via the webhook, you can delete these parameters. If you need to add limitations, submit a support request.
                      properties:
                        criteria:
                          type: string
                          description: 'The event type that prevents a webhook from firing:   <ul> <li><strong><a href="https://developer.orangelogic.com/reference/webhooks#body" target="_blank">Topic</a></strong>: Filters by the event type, such as when an asset is created, deleted, or modified, in the format <code>domain.eventname</code>. For example, the topic when an asset is created is: <code>Documents.Created</code>. </li> <li><strong>Data</strong>: Filters directly on the data itself.</li> <li><strong>Tenant</strong>: Filters by the site short location code.</li> <li><strong>UserId</strong>: Filters by the originating user who triggered the event.</li> </ul>'
                          enum:
                          - Topic
                          - Data
                          - Tenant
                          - UserID
                        pattern:
                          type: string
                          description: 'The pattern of the event type that prevents a webhook from firing, in wildcard format:  <ul> <li><code>?</code> means none or one character (any character).</li> <li><code>&ast;</code> means none or any number of any characters.</li> </ul> For example, let’s say you don’t want Orange Logic to send webhooks for any event type that deletes a document’s metadata. You’d enter <code>&ast;.Delete</code>.'
            examples:
              Request Example:
                value:
                  subscription:
                    id: Mango1
                    name: Mangovations1
                    description: Triggered when assets are deleted.
                    isActive: true
                    definition:
                      targetURL: https://webhook.site/f4afb103-dd97-4374-a5d6-f0d6188ed3a0
                      customHeaders:
                        jobInformation: webhook demo
                      inclusivePredicates:
                      - name: All topics
                        description: Trigger webhooks whenever a topic is deleted.
                        conditions:
                        - criteria: Topic
                          pattern: '*.deleted'
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n  \"subscription\": {\n    \"id\": \"Mango1\",\n    \"name\": \"Mangovations1\",\n    \"description\": \"Triggered when assets are deleted.\",\n    \"isActive\": true,\n    \"definition\": {\n      \"targetURL\": \"https://webhook.site/f4afb103-dd97-4374-a5d6-f0d6188ed3a0\",\n      \"customHeaders\": {\n        \"jobInformation\": \"webhook demo\"\n      },\n      \"inclusivePredicates\": [\n        {\n          \"name\": \"All topics\",\n          \"description\": \"Trigger webhooks whenever a topic is deleted.\",\n          \"conditions\": [\n            {\n              \"criteria\": \"Topic\",\n              \"pattern\": \"*.deleted\"\n            }\n          ]\n        }\n      ],\n      \"exclusivePredicates\": null\n    }\n  }\n}"
              schema:
                type: object
                properties:
                  subscription:
                    type: object
                    properties:
                      id:
                        type: string
                        example: Mango1
                      name:
                        type: string
                        example: Mangovations1
                      description:
                        type: string
                        example: Triggered when assets are deleted.
                      isActive:
                        type: boolean
                        example: true
                        default: true
                      definition:
                        type: object
                        properties:
                          targetURL:
                            type: string
                            example: https://webhook.site/f4afb103-dd97-4374-a5d6-f0d6188ed3a0
                          customHeaders:
                            type: object
                            properties:
                              jobInformation:
                                type: string
                                example: webhook demo
                          inclusivePredicates:
                            type: array
                            items:
                              type: object
                              properties:
                                name:
                                  type: string
                                  example: All topics
                                description:
                                  type: string
                                  example: Trigger webhooks whenever a topic is deleted.
                                conditions:
                                  type: array
                                  items:
                                    type: object
                                    properties:
                                      criteria:
                                        type: string
                                        example: Topic
                                      pattern:
                                        type: string
                                        example: '*.deleted'
                          exclusivePredicates: {}
      deprecated: false
      security: []
  /rotatesecret_22P_v1:
    post:
      summary: Generate a secret key for a webhook signature
      description: Generate or update the secret key for a webhook signature
      operationId: add-or-update-a-webhook-signature
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                newSecret:
                  type: string
                  description: An alphanumeric string to be the <code>newSecret</code>. If you leave this parameter empty, Orange Logic generates a random secret and adds it to the response body.
                  default: '""'
                subscriptionID:
                  type: string
                  description: The subscriptionID of the webhook you are creating a secret for.
            examples:
              Request Example:
                value:
                  newSecret: ''
                  subscriptionId: Mango1
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n \"newSecret\": \"GNSlz1PkDXih\"\n}"
              schema:
                type: object
                properties:
                  newSecret:
                    type: string
                    example: GNSlz1PkDXih
      deprecated: false
      security: []
