                  items:
                    type: string
                identifiers:
                  type: array
                  description: The unique ID of one or more assets you’re invalidating the cache for.  Either <code>accessKeys</code> or <code>identifiers</code> are required.
                  items:
                    type: string
                cdnApiId:
                  type: string
                  description: The <a href="https://developer.orangelogic.com/reference/cloudfront-cdn-cache-invalidation#get-cloudfront-distribution-information" target="_blank">API ID of the Cloudfront distribution</a> used to distribute this asset’s formats.
