  /oauth2/registerclient_23X_v1:
    post:
      summary: OAuth 2.0 client registration
      description: Create an account for a third-party application
      operationId: oauth-2-client-registration
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - name
              - redirectURIs
              properties:
                name:
                  type: string
                  description: The name of the application account.
                description:
                  type: string
                  description: A description of the application account.
                iconID:
                  type: string
                  description: The <a href="https://orangedam.readme.io/docs/assets#record-id">record ID</a> of an asset in Orange Logic.<br></br>Choose an image file, such as a logo, to identify the account. An account icon image is not required, but we recommend using one because users see this image when they authorize the third-party application.
                redirectURIs:
                  type: string
                  description: The URL the user is redirected to after authorizing the application.<br></br>A redirect URI is often the home page or login page of the third-party application. Check the API documentation of the third-party application to find a recommended URI redirect address.
                seed:
                  type: string
                  description: A unique value that allows any new accounts created with the same name and seed to generate the same OAuth credentials.<br></br>Seeds are optional. However, we strongly recommend using them to simplify your configuration by creating consistent credentials across environments or sites. You can enter any string, but we recommend including the account name. Keep seeds confidential and document their purpose clearly to simplify future account management.
                groups:
                  type: string
                  description: A list of the <a href="https://link.orangelogic.com/CMS4/Permalinks/2P7YOHDZQUNL" target="_blank">groups</a> the application account is assigned to.
            examples:
              Request Example:
                value:
                  clientInfo:
                    name: Canva
                    description: Oauth credential account for Canva integration
                    iconID: 2QDTWAWHUT7
                    redirectURIs:
                    - https://www.canva.com/login/
                    seed: canva
                  groups:
                  - '*Everyone'
                  - '*RegisteredUsers'
                  - '*SuperAdmin'
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n  \"info\": {\n    \"id\": \"hoVe5vyeD2TtImZy.canva.orangelogic.com\",\n    \"name\": \"Canva\",\n    \"description\": \"Oauth credential account for Canva integration\",\n    \"iconID\": \"2QDTWAWHUT7\",\n    \"redirectURIs\": [\n      \"https://www.canva.com/login/\"\n    ]\n  },\n  \"credentials\": {\n    \"id\": \"hoVe5vyeD2TtImZy.canva.mangovations.com\",\n    \"secret\": \"DjZoRf8FnNmDYP8hX2nOErOs9iOGF70oMlQ_yYF91pQ\"\n  }\n}"
              schema:
                type: object
                properties:
                  info:
                    type: object
                    properties:
                      id:
                        type: string
                        example: hoVe5vyeD2TtImZy.canva.orangelogic.com
                      name:
                        type: string
                        example: Canva
                      description:
                        type: string
                        example: Oauth credential account for Canva integration
                      iconID:
                        type: string
                        example: 2QDTWAWHUT7
                      redirectURIs:
                        type: array
                        items:
                          type: string
                          example: https://www.canva.com/login/
                  credentials:
                    type: object
                    properties:
                      id:
                        type: string
                        example: hoVe5vyeD2TtImZy.canva.mangovations.com
                      secret:
                        type: string
                        example: DjZoRf8FnNmDYP8hX2nOErOs9iOGF70oMlQ_yYF91pQ
      deprecated: false
