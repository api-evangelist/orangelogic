                client_id:
                  type: string
                  description: The client ID from the third-party application’s account in Orange Logic.
                client_secret:
                  type: string
                  description: The client secret from the third-party application’s account in Orange Logic.
                grant_type:
                  type: string
                  description: 'The type of authorization code you’re providing to generate the token. Enter one of two values: <code>authorization_code</code> or <code>refresh_token</code>.'
                  default: authorization_code
                code:
                  type: string
                  description: The authorization code provided by the third-party application when you run the <a href="https://developer.orangelogic.com/docs/authorize-third-party-apps#run-the-authorization-call">authorization call</a>.<br><b>Or</b>, the refresh token that you generated with a previous call.
