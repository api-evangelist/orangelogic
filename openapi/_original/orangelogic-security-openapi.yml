  /bearerauthentication/getbearertoken_42P_v1:
    get:
      summary: Get bearer token
      description: Retrieve the non-expiring bearer token of an Orange Logic user
      operationId: get-bearer-token
      parameters:
      - name: UserEmail
        in: query
        description: The email address of an Orange Logic user.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n  \"bearerToken\": \"Bearer dvpKCR0cOsg3m.4BJgS0z74yBBnyJYp79JPFQCIrcx6SmGTU0gc3wD1UBt5uALSDX97XocdZ0Gg6OvHlDggrzoBEN8opbyykf1Y0Poalh1I*\",\n  \"errorMessage\": null\n}"
              schema:
                type: object
                properties:
                  bearerToken:
                    type: string
                    example: Bearer dvpKCR0cOsg3m.4BJgS0z74yBBnyJYp79JPFQCIrcx6SmGTU0gc3wD1UBt5uALSDX97XocdZ0Gg6OvHlDggrzoBEN8opbyykf1Y0Poalh1I*
                  errorMessage: {}
      deprecated: false
      x-readme:
        code-samples:
        - language: text
          code: "  'https://mangovations.com/webapi/security/bearerauthentication/getbearertoken_42P_v1?UserEmail=kristen.harrison%40mangovations.com' \\\n  -H 'accept: text/plain'"
        samples-languages:
        - text
  /bearerauthentication/setactivation_42Q_v1:
    get:
      summary: Set activation
      description: Turn on or off an account’s authentication token
      operationId: set-activation
      parameters:
      - name: UserEmail
        in: query
        description: The email address of an Orange Logic user.
        required: true
        schema:
          type: string
      - name: Activation
        in: query
        description: 'Enter a Boolean value to represent the activation state of the user’s bearer token.<br><strong>Example</strong>: Enter <code>on</code>, <code>true</code>, <code>yes</code>, <code>y</code>, or <code>1</code> to activate a token. Enter <code>off</code>, <code>false</code>, <code>no</code>, <code>n</code>, or <code>0</code> to deactivate a token.'
        required: true
        schema:
          type: boolean
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n  \"success\": true,\n  \"errorMessage\": \"\"\n}"
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                    default: true
                  errorMessage:
                    type: string
                    example: ''
      deprecated: false
      x-readme:
        code-samples:
        - language: text
          code: "  'https://mangovations.com/webapi/security/bearerauthentication/setactivation_42Q_v1?UserEmail=kristen.harrison%40mangovations.com&Activation=on' \\\n  -H 'accept: text/plain'"
        samples-languages:
        - text
  /clientcredentialsauthentication/authenticate_46H_v1:
    post:
      summary: Authenticate
      description: Authenticate a user by providing client credentials
      operationId: authenticate
