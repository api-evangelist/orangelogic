  /uploadmediawithurl_45L_v1:
    post:
      summary: Upload media with URL
      description: Upload a single file from an online storage system to Orange Logic by providing a file URL
      operationId: upload-media-with-url
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - folderRecordID
              - fileURL
              properties:
                folderRecordID:
                  type: string
                  description: <a href="https://developer.orangelogic.com/reference/assets#record-id">RecordID</a> of the folder to upload the asset to
                fileURL:
                  type: string
                  description: The URL of the file being uploaded
                fileName:
                  type: string
                  description: 'A name for the file being uploaded, including the file extension. For example: London Eye.jpg<br></br>If you don’t specify a filename, Orange Logic creates one from the response''s Content-Disposition header or from the file URL.'
                importMode:
                  type: string
                  description: Determines how the upload is processed in the background. Go to <a href="https://developer.orangelogic.com/reference/upload#upload-processing-options">Upload processing options</a> for more information.
                  default: ProcessInLine
                  enum:
                  - processInLine
                  - ProcessProxiesInBackground
                  - ProcessFullyInBackground
                  - ProcessFullyInBackgroundLite
                metadata:
                  type: object
                  description: Use this to set field values on a new asset in the same call as the upload. Send a JSON object where each key is a field's API name and each value is a string. Use API names, not the labels shown in the interface (CoreField.Title, shown below, is only an example). You can use any field's API name as a key, and you can include as many fields as you need. When you first add a field, upload one test file and check that the asset shows the value you expect.
                  properties:
                    name:
                      type: string
                      description: CoreField.Title
            examples:
              Request body:
                value:
                  folderRecordID: 2QDZIFL0NEF
                  fileURL: https://images.pexels.com/photos/...
                  fileName: coffee mug.jpeg
                  importMode: ProcessInLine
                  metadata:
                    CoreField.Title: Coffee mug on a desk
                    MyNamespace.MyField: Custom field value
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n    \"isSuccess\": true,\n    \"fileIdentifier\": \"ZZ22I3M\",\n    \"fileRecordID\": \"2QDZIFL0I7S\",\n    \"warningMessage\": null\n}"
              schema:
                type: object
                properties:
                  isSuccess:
                    type: boolean
                    example: true
                    default: true
                  fileIdentifier:
                    type: string
                    example: ZZ22I3M
                  fileRecordID:
                    type: string
                    example: 2QDZIFL0I7S
                  warningMessage: {}
