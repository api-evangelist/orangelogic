    get:
      summary: Custom route job status
      description: Query the job status for custom route creation or obtain custom route links
      operationId: custom-route-job-status
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                jobRecordID:
                  type: string
                  description: The <code>jobRecordID</code> of the custom route job you want to check the status of.
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: "{}{\n  \"jobStatus\": \"Succeeded\",\n  \"result\": {\n    \"isRunning\": false,\n    \"jobRecordID\": \"2Z9XPH3T3T3\",\n    \"results\": [\n      {\n        \"assetID\": \"2Z9XC5NG0N6\",\n        \"format\": \"TR1\",\n        \"expirationDate\": \"2026-07-25T12:55:05.943Z\",\n        \"link\": \"https://mango-cdn.orangelogic.com/public/Promenade-des-Anglais-Nice-TR1.auto\n\"\n      },\n      {\n        \"assetID\": \"2Z9XC5NNOOC\",\n        \"format\": \"TR1\",\n        \"expirationDate\": \"2026-07-25T12:55:05.943Z\",\n        \"link\": \"https://mango-cdn.orangelogic.com/public/historic-village-in-provence-tr1.auto\"\n      }\n    ]\n    \"errors\": []\n  }\n}\n"
        '400':
