openapi: 3.2.0
info:
  title: upload-media-web Uploadmedia 4az V1 API
  version: '1.0'
servers:
- url: https://{OrangeLogicURL}/webapi/mediafile/import/upload
  variables:
    OrangeLogicURL:
      default: OrangeLogicURL
security:
- sec0: []
tags:
- name: Uploadmedia 4az V1
paths:
  /uploadmedia_4az_v1:
    post:
      summary: Upload media
      description: Simultaneously upload multiple files from your computer to Orange Logic
      operationId: upload-media-endpoint
      parameters:
      - name: Content-Type
        in: header
        description: The <code>multipart/form-data</code> header parameter is required for this call.
        required: true
        schema:
          type: string
          default: multipart-formdata
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - folderRecordID
              - files
              properties:
                folderRecordID:
                  type: string
                  description: <a href="https://orangedam.readme.io/docs/assets#record-id">RecordID</a> of the folder to upload the asset to
                processAssetInBackground:
                  type: boolean
                  description: '<ul><li><code>True</code>: The API call is completed when the asset record has been created and can receive updates with subsequent API calls. The metadata import and proxy file generation occur in the background. This option takes a shorter amount of time.</li><li><code>False</code>: The API call is completed when the asset is fully ingested, meaning all proxy formats have been generated. This option takes a longer amount of time.</li><ul>'
                files:
                  type: string
                  description: The files to upload.
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n    \"uploadResults\": [\n        {\n            \"fileName\": \"orange chair.jpeg\",\n            \"isSuccess\": true,\n            \"fileIdentifier\": \"ZZ22I3H\",\n            \"warningMessage\": \"\"\n        }\n    ]\n}"
              schema:
                type: object
                properties:
                  uploadResults:
                    type: array
                    items:
                      type: object
                      properties:
                        fileName:
                          type: string
                          example: orange chair.jpeg
                        isSuccess:
                          type: boolean
                          example: true
                          default: true
                        fileIdentifier:
                          type: string
                          example: ZZ22I3H
                        warningMessage:
                          type: string
                          example: ''
      deprecated: false
