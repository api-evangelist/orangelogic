paths:
  /getreportinfo_4102_v1:
    get:
      summary: Get report information
      description: Retrieve the columns and filters of a specified report
      operationId: get-report-information
      parameters:
      - name: ID
        in: query
        description: The <a href="https://developer.orangelogic.com/reference/reports#find-a-report-id">report ID</a>.
        required: true
        schema:
          type: string
      - name: ListAllColumns
        in: query
        description: '<ul><li><code>false</code>: Return only the columns currently selected for the report in the Orange Logic interface.</li><li><code>true</code>: Return all the columns available for the specified report.</li></ul>'
        schema:
          type: string
          default: 'false'
