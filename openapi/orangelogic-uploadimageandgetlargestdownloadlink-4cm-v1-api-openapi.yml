paths:
  /uploadimageandgetlargestdownloadlink_4CM_v1:
    post:
      summary: Upload image and get largest download link
      description: Upload an image from your computer to Orange Logic and receive a download link to the largest available asset format.
      operationId: upload-and-get-link
      parameters:
      - name: Content-Type
        in: header
        description: The <code>multipart/form-data</code> header parameter is required for this call.
        required: true
        schema:
          type: string
          default: multipart-formdata
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - folderRecordID
              - files
              - clientFileName
              properties:
                folderRecordID:
                  type: string
                  description: <a href="https://developer.orangelogic.com/reference/assets#record-id">RecordID</a> or <a href="https://developer.orangelogic.com/reference/assets#unique-identifiers">Unique ID</a> of the folder to upload the asset to
                files:
                  type: string
                  description: The file to upload.
                clientFileName:
                  type: string
                  description: 'The filename, including the file extension. For example: London Eye.jpg'
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n    \"downloadLink\": \"https://university1.orangelogic.com/AssetLink/k7a04i007p163o85jhqte2no1lmlejal.png\",\n    \"message\": null\n}"
              schema:
                type: object
                properties:
                  downloadLink:
                    type: string
                    example: https://university1.orangelogic.com/AssetLink/k7a04i007p163o85jhqte2no1lmlejal.png
                  message: {}
      deprecated: false
