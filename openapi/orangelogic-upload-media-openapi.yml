                                    type: string
                                    example: Mangovations.png
                                  IsOptional:
                                    type: boolean
                                    example: false
                                    default: true
                                  ValueCount:
                                    type: integer
                                    example: 1
                                    default: 0
                              UploadMode:
                                type: object
                                properties:
                                  Value:
                                    type: string
                                    example: ProcessInLine
                                  IsOptional:
                                    type: boolean
                                    example: false
                                    default: true
                                  ValueCount:
                                    type: integer
                                    example: 1
                                    default: 0
                              IgnoreCheckContainer:
                                type: object
                                properties:
                                  Value:
                                    type: string
                                    example: 'false'
                                  IsOptional:
                                    type: boolean
                                    example: true
                                    default: true
                                  ValueCount:
                                    type: integer
                                    example: 1
                                    default: 0
                              Metadata:
                                type: object
                                properties:
                                  Value:
                                    type: string
                                    example: '{&quot;CoreField.Title&quot;:&quot;Mangovations logo&quot;, &quot;CoreField.Description&quot;: Approved logo for 2025&quot;}'
                                  IsOptional:
                                    type: boolean
                                    example: true
                                    default: true
                                  ValueCount:
                                    type: integer
                                    example: 1
                                    default: 0
                      Response:
                        type: object
                        properties: {}
                      ExecutionStatus:
                        type: string
                        example: Executed
                      HTTPCode:
                        type: integer
                        example: 200
                        default: 0
                      Code:
                        type: string
                        example: SUCCESS
                      SystemIdentifier:
                        type: string
                        example: ZZ1409J
      deprecated: false
      x-readme:
        code-samples:
        - language: text
          code: "curl -X 'POST' \\\n  'https://university1.orangelogic.com/api/UploadMedia/v3.0/UploadNewMedia?FolderRecordID=ZZ1282Z&FileName=Mangovations.png&UploadMode=ProcessInLine&IgnoreCheckContainer=false&Metadata=%7B%22CoreField.Title%22%3A%22Mangovations%20logo%22%2C%20%22CoreField.Description%22%3A%20Approved%20logo%20for%202025%22%7D&format=JSON' \\\n  -H 'accept: application/json' \\\n  -H 'Content-Type: multipart/form-data' \\\n  -F 'InputStream=@Mangovations.png;type=image/png'"
        - language: python
          code: "url = \"https://university1.orangelogic.com/api/UploadMedia/v3.0/UploadNewMedia\"\nheaders = {\n   \"Authorization\": \"Bearer 1234567890\",\n}\nparams = {\n   \"FolderRecordID\": \"ZZ1282Z\",\n   \"FileName\": \"Mangovations.png\",\n   \"UploadMode\": \"ProcessInLine\",\n   \"Format\": \"JSON\"\n   \"Custom_Metadata\":\"{\"CoreField.Title\":\"Mangovations logo\", \"CoreField.Description\":\"Approved logo for 2025\"}\"\n}\nfiles = {\"file\": ('Mangovations.png', open('Mangovations.png', 'rb'), 'image/png}')}\nprint(files)\nresponse = requests.post(url, headers=headers, params=params, files=files)\n\nprint(\"Status Code:\", response.status_code)\nprint(\"Response Text:\", response.text)"
        - language: node
          code: "const fs = require('fs');\nconst FormData = require('form-data');\nconst axios = require('axios');\n\n//If you are testing a prototype, you can add the line below to deactivate strict ssl settings.\nprocess.env['NODE_TLS_REJECT_UNAUTHORIZED'] = '0';\n\nasync function login() {\n  const username = encodeURIComponent('youremail');\n  const password = encodeURIComponent('yourpassword');\n  const loginUrl = `https://{OrangeLogicURL}/api/Authentication/v2.0/Login?Login=${username}&Password=${password}&IncludeUserEmail=false&format=JSON`;\n  const loginRes = await axios.post(loginUrl, {}, { withCredentials: true });\n  console.log('Login response:', loginRes.data);\n\n  const setCookie = loginRes.headers['set-cookie'];\n  let cookieHeader = '';\n  if (setCookie && setCookie.length > 0) {\n    cookieHeader = setCookie.map(cookie => cookie.split(';')[0]).join('; ');\n    console.log('Cookie header:', cookieHeader);\n  }\n\n  if (!(loginRes.data && loginRes.data.APIResponse.Response.Token))\
            \ {\n    throw new Error('Login failed');\n  }\n  const token = loginRes.data.APIResponse.Response.Token;\n\n  return { token, cookieHeader };\n}\n\nasync function uploadFile(token, cookieHeader) {\n  const form = new FormData();\n  form.append('InputStream', fs.createReadStream('{file to upload}'));\n  \n  // The folder's RecordID is different from its unique identifier.\n  const uploadUrl = '{OrangeLogicURL}/api/UploadMedia/v3.0/UploadNewMedia?FolderRecordID=2Y82VXOHT74&UploadMode=ProcessInLine&FileName=[filename of the file you are uploading]&format=JSON&IgnoreCheckContainer=false';\n\n  const headers = {\n    accept: 'application/json',\n    authorization: `Bearer ${token}`,\n    Cookie: cookieHeader,\n    ...form.getHeaders()\n  };\n\n  try {\n    const uploadRes = await axios.post(uploadUrl, form, { headers });\n    console.log('Upload response:', uploadRes.data);\n  } catch (e) {\n    if (e.response) {\n      console.log('Raw upload response:', e.response.data);\n    }\
            \ else {\n      console.error(e);\n    }\n  }\n}\n\n(async () => {\n  try {\n    const { token, cookieHeader } = await login();\n    await uploadFile(token, cookieHeader);\n  } catch (err) {\n    console.error(err);\n  }\n})();"
        samples-languages:
        - text
        - python
        - node
