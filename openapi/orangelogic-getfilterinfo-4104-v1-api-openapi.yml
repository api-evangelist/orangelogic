info:
  title: report Getfilterinfo 4104 V1 API
  version: '1.0'
servers:
- url: https://{OrangeLogicURL}/webapi/report/export
  variables:
    OrangeLogicURL:
      default: OrangeLogicURL
security:
- sec0: []
tags:
- name: Getfilterinfo 4104 V1
paths:
  /getfilterinfo_4104_v1:
    get:
      summary: Get filter information
      description: Retrieve the options for a specified filter in a report
      operationId: get-filter-information
      parameters:
      - name: ReportID
        in: query
        description: The <a href="https://developer.orangelogic.com/reference/reports#find-a-report-id">report ID</a>.
        required: true
        schema:
          type: string
      - name: FilterID
        in: query
        description: The filter ID. <ul><li>Use the <a href="https://developer.orangelogic.com/reference/get-report-information">Get report information</a> call to retrieve the available filters.</li> <li>The filter you specify here must be available in the report you specify in the <strong>ReportID</strong> parameter.
        required: true
        schema:
          type: string
      - name: Search
        in: query
        description: 'Enter text to narrow the filter options returned when retrieving information for filters. This option only applies to filters with the type <strong>AutoCompletion</strong> and <strong>Options</strong>.<p>Use the <a href="https://developer.orangelogic.com/reference/get-report-information">Get report information</a> call to retrieve the available filters along with each filter''s filter type.<p><strong>Example</strong>: The <strong>Groups</strong> filter has a filter type of <strong>AutoCompletion</strong>. When you use this call to return available values for this filter, you might use the search text “admin” to return only the groups that include “admin” in their name.'
        schema:
          type: string
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n    \"id\": \"AC_ContactGroup\",\n    \"type\": \"AutoCompletion\",\n    \"filterOptions\": [\n        {\n            \"id\": \"U3JsZnFAWEZ1UmQ0dVFDS0lPSExBdEVOZll0U1pocUN0Z3d6Sm1TYVJFcyo\",\n            \"label\": \"*SuperAdmin\"\n        },\n        {\n            \"id\": \"ODZ0VHM1V2tvY1E3NGZJTlhMOXA4Vm5xak9WQWx6clFzRkJOUHpsTDNzQSo\",\n            \"label\": \"Admin - Advanced\"\n        },\n        {\n            \"id\": \"M0trZDhXclh4eVB3NWdoWlVnSFcuNWl2M21OSTRTTW9vYURVTHdhSVNvNCo\",\n            \"label\": \"Admin - General\"\n        },\n        {\n            \"id\": \"bmFpaEVSMVR2dnQubllHMnp1U0lGaXdXTHJ1dVAyZDJHYmNUR1JoSmhCUSo\",\n            \"label\": \"Client Admin\"\n        },\n        {\n            \"id\": \"cnJuVHM3dUVZWS5Tb0BsellmYmlaRndYZTBtcnIyS2FBMVJXaFZaQ3ZHZXpHNTdsQ2JZS3p5QkhpWERJa3FZWQ\",\n            \"label\": \"Marketing Administrators\"\n        },\n        {\n            \"id\": \"U0BLUEVkakswak01ZjVVSDA0U1ljVnl4b21CeUBScUBUY1hwcmhoSnhMWVZHa3lZN0h5WFBUSnNvWUNZMndkcg\",\n            \"label\": \"Product marketing administrators\"\n        },\n    ]\n}"
