paths:
  /getpresignedlinks_in_batch_4G8_v1:
    post:
      summary: Get presigned links in batch
      description: Get multiple assets’ cloud storage links
      operationId: get-presigned-links-in-batch
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                RecordID:
                  type: string
                  description: The asset's <a href="https://orangedam.readme.io/docs/assets#record-id">RecordID or unique identifier</a>.
                Format:
                  type: string
                  description: The code of the <a href="https://developer.orangelogic.com/reference/assets#formats">asset format</a> that you want to generate a link for (TRX, TR1, etc.).
                GenerateIfNeeded:
                  type: boolean
                  description: 'If Orange Logic does not generate this asset by default, indicate whether the asset should be generated. </br> </br> 🎓 <b> Insight: Optional Formats </b> </br> When you determine which proxies must be created when assets are uploaded to Orange Logic, you can specify optional formats that are not created by default. (This is usually done to save on storage costs.) If you are generating a link for an optional format, use this parameter to determine whether Orange Logic generates that proxy along with the link. </br> </br>  <b> Note</b>: If you opt to generate the format with the link, the asset generation process occurs in the background. If you receive a 404 error, wait a few moments. Then, try running the call again.'
                SkipCheckExistence:
                  type: boolean
                  description: Whether the API checks whether the asset exists. If you know the asset exists, you can skip the check to save time.
                ValidityDuration:
                  type: string
                  description: 'An expiration for the link. The default is ten minutes. </br></br> Format: <b>[x]d[y]h[z]m</b> </br><b>x</b>: Number of days<br><b>y</b>: Number of hours<br><b>z</b>: Number of minutes </br></br> Example: <b>1d2h3m</b> means 1 day, 2 hours, and 3 minutes.'
            examples:
              Request Example:
                value:
                  records:
                  - recordID: ZZ11BC
                    format: TR1
                  - recordID: ZZ11B5
                    format: TR1
                  - recordID: ZZ11BA
                    format: TR1
                  generateIfNeeded: false
                  validityDuration: 1h
                  skipCheckExistence: false
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n   \"ZZ11BC\":{\n      \"TR1\":{\n         \"link\":\"https://mangovations.com/Assets/V2/k09m@tB7notE65jMA8JeC9M2_YiwtvAm5L4Iio5IEFxgWM1zO962uKPHAZZGUl4CgXizN5PodppA4wEyoHNDMP2U3ws9@VNwDe__T73a6lYHbNdKgQoihYkAaUHK3qCg/y6C7zvnXzd5fA4sd/Gqm_ZbmWl36D81dV/ZZ11BC.jpg\",\n         \"error\":null,\n         \"errorCode\":null\n      }\n   },\n   \"ZZ11B5\":{\n      \"TR1\":{\n         \"link\":\"https://mangovations.com/Assets/V2/k09m@tB7notE65jMA8JeC46YHMv_lwzQoRZra17tVQ8CO9agq23xCXTz6g@Y9XS3n0Co3lT6cdNua7ecRHhaB1XakeGyFtB@CbJhJk1g8XWp@wHmiUOJdedznzP2L3rP/0bkX2pNxplG8raVP/gKF42FYKgHxwkOMu/ZZ11B5.jpg\",\n         \"error\":null,\n         \"errorCode\":null\n      }\n   },\n   \"ZZ11BA\":{\n      \"TR1\":{\n         \"link\":\"mangovations.com/Assets/V2/k09m@tB7notE65jMA8JeCyxa0cqsmTqOKiaxMLimTz868gaSasqchf0KB@pbM5PDLZIQx36f6i2yTRu9PACcNY9uFIT0W7jo39F78oNsj0p0ZyeeAlgneeWX8QIBLdk2/sZljXDx5hL79Sdz9/frgu_h3PsyRSoz3m/ZZ11BA.jpg\",\n         \"error\":null,\n         \"errorCode\":null\n      }\n   }\n}"
